name: CI

# Triggers on pushes to master and every PR targeting master. The previous
# config triggered on `main` / `develop` which never exist on this repo, so
# nothing actually ran.

on:
  push:
    branches: [master]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/**'
      - 'tsconfig.base.json'
      # Dockerfile / compose changes must trigger CI so the docker job runs.
      # (Without these, a Dockerfile-only PR shows "no checks" — which is how
      # the feed-engine COPY gap reached production on 2026-06-15.)
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'scripts/**'
  pull_request:
    branches: [master]

# Cancel in-progress runs for the same ref when a new push lands — avoids
# burning runner minutes on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  # pnpm version is intentionally NOT pinned here — `pnpm/action-setup@v4`
  # auto-reads `packageManager` from root `package.json` (currently
  # `pnpm@9.0.0`). Specifying both `version:` and `packageManager` causes
  # the action to bail with `ERR_PNPM_BAD_PM_VERSION`. Bump `packageManager`
  # in `package.json` to upgrade pnpm — CI will follow automatically.

jobs:
  # ------------------------------------------------------------------
  # Lint + TypeScript across the whole workspace.
  # ------------------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      # `packages/workbench-core` ships its declarations from `dist/index.d.ts`,
      # which is gitignored (built artifact). Without it, every dependent
      # typecheck below errors with `Cannot find module '@rinjani/workbench-core'`.
      # `build:lib` is the tsup step only (~3s) — we skip the heavier Vite UI
      # build since the typecheck doesn't need the bundled UI assets.
      - name: Build workbench-core lib (declarations)
        run: pnpm --filter @rinjani/workbench-core run build:lib

      - name: Typecheck (api)
        run: pnpm --filter @rinjani/api exec tsc --noEmit

      - name: Typecheck (worker)
        run: pnpm --filter @rinjani/worker exec tsc --noEmit

      - name: Typecheck (gateway)
        run: pnpm --filter @rinjani/gateway exec tsc --noEmit

      - name: ESLint
        run: pnpm lint
        # eslint config rules may surface as new errors when deps update —
        # don't block CI on them yet, but log them.
        continue-on-error: true

  # ------------------------------------------------------------------
  # Unit tests with a real Postgres service container.
  # ------------------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rinjani_v3_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      # Same reason as in the lint job — apps/api imports `@rinjani/workbench-core`
      # and vitest will fail at module load if the dist isn't present.
      - name: Build workbench-core lib
        run: pnpm --filter @rinjani/workbench-core run build:lib

      # `db:apply`, NOT `db:migrate`. The latter is drizzle-kit and only
      # applies migrations registered in `drizzle/meta/_journal.json` (a
      # small subset). The bulk are hand-authored numbered `.sql` files
      # (currently 0001–0059); `db:apply` runs the custom
      # apply-migrations.ts that picks up every `*.sql` file in the
      # drizzle dir in lexicographic order and tracks application in a
      # `__sql_migrations` table.
      #
      # The earlier version of this step called `pnpm migrate` — there is
      # no script by that name (only `db:migrate` and `db:apply`), so
      # pnpm printed "None of the selected packages has a 'migrate'
      # script" and exited 0. The test DB ran completely empty, the API
      # then crashed on its first DB read with `relation "roles" does
      # not exist`, and every integration test failed downstream.
      - name: Run migrations
        run: pnpm --filter @rinjani/db db:apply
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rinjani_v3_test

      # `pnpm test` runs the UNIT suite only (see
      # apps/api/vitest.config.ts — `src/__tests__/integration/**` is
      # excluded). Unit tests cover schema validation, scoring,
      # registry shape, and other pure-logic concerns; they need
      # Postgres + Redis (already started as service containers above)
      # and nothing else.
      #
      # Integration tests live under `src/__tests__/integration/` and
      # require the full local stack (Neo4j + OpenSearch + a running
      # API on :3001 + auth-aware test calls). Run those locally with
      # `pnpm --filter @rinjani/api test:integration` against your
      # dev `docker compose up -d` + `pnpm dev` stack.
      - name: Run unit tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rinjani_v3_test
          REDIS_URL: redis://localhost:6379
          REDIS_QUEUE_URL: redis://localhost:6379
          REDIS_CACHE_URL: redis://localhost:6379
          JWT_SECRET: ci-test-jwt-secret-do-not-use-in-production
          NODE_ENV: test

  # ------------------------------------------------------------------
  # Workbench-core UI build needs Node 20+ for the Tailwind 4 oxide
  # native binding; we re-run install on Node 20 to fetch the binary
  # that Node 18 silently skips.
  # ------------------------------------------------------------------
  build:
    name: Workspace build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

  # ------------------------------------------------------------------
  # Docker image integrity.
  #
  # Two checks for the failure mode that crash-looped production on
  # 2026-06-15: a new workspace package (@rinjani/feed-engine) was added
  # as an API dependency but never COPY'd into the Dockerfile. The host
  # pnpm workspace resolves it fine, so tsc / test / build all passed —
  # the crash only surfaced at container runtime as ERR_MODULE_NOT_FOUND.
  #
  #   1. Static guard (scripts/check-dockerfile-deps.mjs): asserts every
  #      `workspace:*` dep of api+worker has a Dockerfile COPY. ~50ms,
  #      deterministic, catches the exact class. This is the real guard.
  #   2. `docker build`: catches broader Dockerfile breakage (bad COPY
  #      paths, failed build steps). Note: a successful build alone does
  #      NOT catch the COPY-gap class — that's why the static check exists.
  # ------------------------------------------------------------------
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Pure Node script, no install needed — runs against the checked-out
      # package.json files + Dockerfile directly.
      - name: Check Dockerfile wires all workspace deps
        run: node scripts/check-dockerfile-deps.mjs

      - name: Build v3-api image
        run: docker build -t rinjani-api:ci-${{ github.sha }} .

  # ------------------------------------------------------------------
  # Dependency advisory check — runs `pnpm audit` against pinned floors
  # in package.json `pnpm.overrides`. Don't fail the build (some
  # advisories sit in deep transitives we can't override safely without
  # breaking the parent), but surface the count in the run log.
  # ------------------------------------------------------------------
  deps:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (critical + high)
        run: pnpm audit --audit-level=high
        continue-on-error: true
