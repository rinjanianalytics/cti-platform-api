# =============================================================================
# V3 Threat Intelligence API - Helm Values
# =============================================================================

# Global settings
global:
  environment: production
  imagePullSecrets: []

# -----------------------------------------------------------------------------
# API Service
# -----------------------------------------------------------------------------
api:
  enabled: true
  replicaCount: 2
  
  # The image is not published. Build it from the Dockerfile at the root of
  # this repository, push it to your own registry, and point these at it.
  image:
    repository: rinjani/v3-api
    tag: latest
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 3001
  
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/rate-limit: "100"
      nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    hosts:
      - host: api.threat-intel.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: v3-api-tls
        hosts:
          - api.threat-intel.example.com
  
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  
  env:
    NODE_ENV: production
    PORT: "3001"
    LOG_LEVEL: info
    OTEL_ENABLED: "true"
  
  # Each entry reads one key of a Secret you create before installing.
  # The API cannot start without DATABASE_URL, JWT_SECRET and a Redis URL.
  # REDIS_URL serves both the queue and the cache. To split them, replace it
  # with REDIS_QUEUE_URL and REDIS_CACHE_URL.
  envSecrets:
    - name: DATABASE_URL
      secretName: v3-secrets
      secretKey: database-url
    - name: JWT_SECRET
      secretName: v3-secrets
      secretKey: jwt-secret
    - name: REDIS_URL
      secretName: v3-secrets
      secretKey: redis-url
    # Optional. Without Neo4j the graph features are off. Without OpenSearch,
    # search falls back to Postgres. This chart deploys neither Neo4j nor,
    # by default, OpenSearch: point these at instances you run.
    # - name: NEO4J_URI
    #   secretName: v3-secrets
    #   secretKey: neo4j-uri
    # - name: NEO4J_USER
    #   secretName: v3-secrets
    #   secretKey: neo4j-user
    # - name: NEO4J_PASSWORD
    #   secretName: v3-secrets
    #   secretKey: neo4j-password
    # - name: OPENSEARCH_URL
    #   secretName: v3-secrets
    #   secretKey: opensearch-url
  
  # /healthz answers as soon as the process is up and touches no database.
  livenessProbe:
    httpGet:
      path: /healthz
      port: 3001
    initialDelaySeconds: 10
    periodSeconds: 30
  
  # /readyz returns 200 only when Postgres and the queue Redis are reachable.
  readinessProbe:
    httpGet:
      path: /readyz
      port: 3001
    initialDelaySeconds: 5
    periodSeconds: 10

# -----------------------------------------------------------------------------
# Workers and feed sync
# -----------------------------------------------------------------------------
# There is nothing to configure here. BullMQ workers and the scheduler run
# inside the API pod, and the scheduler is the only thing that dispatches
# feed syncs. A Redis boot lock keeps several API pods from scheduling the
# same sync twice. This chart used to ship a separate worker deployment and
# three feed-sync CronJobs; both were removed in chart 2.0.0 because the
# image they ran is no longer built.

# -----------------------------------------------------------------------------
# PostgreSQL (Bitnami subchart)
# -----------------------------------------------------------------------------
# Bitnami removed its free images from docker.io/bitnami in 2025. The
# archived copies live under bitnamilegacy and get no further updates, so
# treat the bundled Postgres and Redis as a way to try the chart. For
# production, set postgresql.enabled and redis.enabled to false and point
# DATABASE_URL and REDIS_URL at databases you run or rent.
postgresql:
  enabled: true
  image:
    repository: bitnamilegacy/postgresql
  auth:
    database: rinjani_v3
    username: rinjani
    existingSecret: v3-secrets
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: postgres-password
  primary:
    persistence:
      enabled: true
      size: 20Gi
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 1Gi

# -----------------------------------------------------------------------------
# Redis (Bitnami subchart)
# -----------------------------------------------------------------------------
redis:
  enabled: true
  image:
    repository: bitnamilegacy/redis
  auth:
    enabled: true
    existingSecret: v3-secrets
    existingSecretPasswordKey: redis-password
  master:
    persistence:
      enabled: true
      size: 5Gi
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi

# -----------------------------------------------------------------------------
# OpenSearch
# -----------------------------------------------------------------------------
opensearch:
  enabled: false  # Enable when ready for vector search
  replicas: 1
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

# -----------------------------------------------------------------------------
# Service Account
# -----------------------------------------------------------------------------
serviceAccount:
  create: true
  name: v3-threat-intel
  annotations: {}

# -----------------------------------------------------------------------------
# Pod Security
# -----------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# -----------------------------------------------------------------------------
# Network Policy
# -----------------------------------------------------------------------------
# Off by default. When on, only the listed sources may reach the API pods.
# The default rule admits the ingress-nginx namespace, matched by the label
# Kubernetes sets on every namespace.
networkPolicy:
  enabled: false
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 3001

# -----------------------------------------------------------------------------
# Pod Disruption Budget
# -----------------------------------------------------------------------------
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# -----------------------------------------------------------------------------
# Monitoring
# -----------------------------------------------------------------------------
# The API has no /metrics endpoint, so there is no ServiceMonitor. It exports
# traces and metrics over OpenTelemetry instead: set OTEL_EXPORTER_OTLP_ENDPOINT
# under api.env to the address of your collector.
